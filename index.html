<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumanti Nails Studio</title>
    <style>
        @font-face {
            font-family: GoogleSans;
            src: url('./assets/fonts/GoogleSans-VariableFont_GRAD\,opsz\,wght.ttf');
        }
        * {
            font-family: 'GoogleSans', sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f0ebdc;
        }
        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .title {
            color: #8a7656;
        }
        .logo-container {
            border-radius: 35px/60px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="logo-container">
                <img src="./assets/imgs/logo.png" alt="Lumanti" class="logo">
            </div>
            <h1 class="title">Lumanti Nails Studio</h1>
            <span class="msg">Come visit us! Located Opposite of Big Mart, Shankhamul.</span>
        </div>
    </div>
</body>
</html>
